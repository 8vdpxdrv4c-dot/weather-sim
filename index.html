<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Q = new URLSearchParams(location.search);
const SHOT = Q.has('shot');

// ---------- exponential height fog (global shader chunk override) ----------
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
varying float vFogDepth; varying vec3 vFogWP;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
vFogDepth = -mvPosition.z; vFogWP = (inverse(viewMatrix) * mvPosition).xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
uniform vec3 fogColor; varying float vFogDepth; varying vec3 vFogWP;
#ifdef FOG_EXP2
uniform float fogDensity;
#else
uniform float fogNear; uniform float fogFar;
#endif
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
#ifdef FOG_EXP2
float fhh = exp(-max(vFogWP.y, 0.0) * 0.08);
float fogFactor = 1.0 - exp(-fogDensity * fogDensity * vFogDepth * vFogDepth * (0.3 + 0.7 * fhh));
#else
float fogFactor = smoothstep(fogNear, fogFar, vFogDepth);
#endif
gl_FragColor.rgb = mix(gl_FragColor.rgb, fogColor, fogFactor);
#endif`;

const NOISE = `
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
 return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x),mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<6;i++){v+=a*vnoise(p);p=r*p;a*=.5;}return v;}
`;

// ---------- weather presets ----------
const W = {
 sunny:   {bfly:1,sat:1.3,warm:.035,lift:.035,name:'晴', icon:'☀️', elev:30, turb:1.1, ray:3.6, mie:.004, cover:.44, dark:0, gray:0, sun:3.6, hemi:1.15, env:1.25, fog:.0032, fogC:0xb9d6f2, wind:.25, rain:0, snow:0, snowG:0, wet:0, leaves:0, exp:.86, bloom:.32, cloudSpd:.6, light:0xfff1dc,
  t:'晴天', d:'天空中云量少（0～2成），太阳辐射强，大气透明度高，天空呈蔚蓝色——这是空气分子对短波蓝光的瑞利散射。地面受热快，昼夜温差大。'},
 overcast:{bfly:0,sat:1.08,warm:0,lift:.07,name:'阴', icon:'☁️', elev:30, turb:8, ray:2.5, mie:.02, cover:.92, dark:.3, gray:.9, sun:.6, hemi:1.4, env:.8, fog:.0065, fogC:0xc3cbd3, wind:.45, rain:0, snow:0, snowG:0, wet:0, leaves:0, exp:.82, bloom:.15, cloudSpd:.9, light:0xeef2f6,
  t:'阴天', d:'云量达8成以上，云层遮蔽太阳，阳光以散射光为主，地面几乎没有清晰的影子。云层的保温作用使昼夜温差变小。'},
 rain:    {bfly:0,sat:1.05,warm:-.02,lift:.05,name:'雨', icon:'🌧️', elev:30, turb:10, ray:3, mie:.03, cover:1, dark:.65, gray:.97, sun:.25, hemi:1.15, env:.55, fog:.014, fogC:0x8d98a3, wind:.75, rain:1, snow:0, snowG:0, wet:1, leaves:0, exp:.78, bloom:.25, cloudSpd:1.4, light:0xc8d2dc,
  t:'雨', d:'暖湿空气上升冷却，水汽凝结成云滴，云滴不断碰并增大，当上升气流托不住时便降落形成降水。强对流时伴有雷电：先见闪电，后闻雷声（光速远大于声速）。'},
 snow:    {bfly:0,sat:1.08,warm:-.01,lift:.05,name:'雪', icon:'❄️', elev:26, turb:6, ray:2, mie:.015, cover:.95, dark:.35, gray:.92, sun:.6, hemi:1.3, env:.8, fog:.011, fogC:0xd6dde5, wind:.3, rain:0, snow:1, snowG:1, wet:0, leaves:0, exp:.8, bloom:.2, cloudSpd:.6, light:0xe8eef8,
  t:'雪', d:'云中温度低于0℃时，水汽直接凝华成冰晶并增长为雪花。近地面气温也较低时，雪花不融化落到地面，逐渐形成积雪，积雪反射率高（可达80%以上）。'},
 fog:     {bfly:0,sat:1.05,warm:.02,lift:.06,name:'雾', icon:'🌫️', elev:20, turb:6, ray:2, mie:.05, cover:.7, dark:.15, gray:.85, sun:.8, hemi:1.3, env:.8, fog:.07, fogC:0xd9dee2, wind:.05, rain:0, snow:0, snowG:0, wet:.25, leaves:0, exp:.82, bloom:.15, cloudSpd:.2, light:0xf0eee6,
  t:'雾', d:'近地面空气中的水汽遇冷凝结成大量悬浮小水滴，使水平能见度低于1千米。常见于晴朗无风、湿度大的清晨（辐射雾），风小、逆温稳定的天气条件有利于雾的形成。'},
 wind:    {bfly:0,sat:1.22,warm:.04,lift:.06,name:'风', icon:'🌬️', elev:34, turb:3, ray:1.6, mie:.006, cover:.5, dark:.12, gray:.1, sun:3.2, hemi:1.1, env:1.15, fog:.0045, fogC:0xcfe0f2, wind:1.7, rain:0, snow:0, snowG:0, wet:0, leaves:1, exp:.84, bloom:.25, cloudSpd:5, light:0xfff4e4,
  t:'大风', d:'风是空气的水平运动，由水平气压梯度力引起。气压差越大，风力越强。大风中草木摇摆、落叶飞扬，云的移动速度也明显加快。'},
};
const ORDER=['sunny','overcast','rain','snow','fog','wind'];
const KEYS=['sat','warm','lift','bfly','elev','turb','ray','mie','cover','dark','gray','sun','hemi','env','fog','wind','rain','snow','snowG','wet','leaves','exp','bloom','cloudSpd'];
const cur={}; for(const k of KEYS) cur[k]=W.sunny[k];
cur.fogC=new THREE.Color(W.sunny.fogC); cur.light=new THREE.Color(W.sunny.light);
let target=W.sunny, curName='sunny';
const RATE={bfly:.8,snowG:.12, wet:.25, snow:.6, rain:.7, leaves:.5};

// ---------- renderer / scene ----------
const renderer=new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=.62;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(cur.fogC.clone(), cur.fog);
const camera=new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .2, 9000);
camera.position.set(0.3,1.05,7.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,.85,0); controls.enableDamping=true; controls.minDistance=1.5; controls.maxDistance=45;
controls.maxPolarAngle=Math.PI/2-.04; if(Q.has('up')){controls.target.set(0,4,0);} if(Q.has('closeup')){camera.position.set(-0.3,1.0,5.6); controls.target.set(-0.6,.62,2.6);} controls.update();

const U={uTime:{value:0},uWind:{value:.25},uWindDir:{value:new THREE.Vector2(1,.35).normalize()},uSnow:{value:0},uSnowG:{value:0},uWet:{value:0}};

// ---------- sky ----------
const sky=new Sky(); sky.scale.setScalar(8000); scene.add(sky);
sky.material.uniforms.uGain={value:+(Q.get('gain')||.24)}; sky.material.uniforms.uTint={value:1};
sky.material.fragmentShader='uniform float uGain,uTint;\n'+sky.material.fragmentShader.replace('gl_FragColor = vec4( retColor, 1.0 );','vec3 sc=retColor*uGain; float sl=dot(sc,vec3(.2126,.7152,.0722)); sc=mix(sc, mix(vec3(sl),sc,1.8)*vec3(.8,.93,1.18), uTint); gl_FragColor = vec4( sc, 1.0 );');
const sunDir=new THREE.Vector3();
const sun=new THREE.DirectionalLight(0xffffff,3); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); const sc=sun.shadow.camera; sc.left=-22;sc.right=22;sc.top=22;sc.bottom=-22;sc.near=1;sc.far=120;
sun.shadow.bias=-.0006; sun.shadow.normalBias=.05; sun.shadow.radius=6; sun.shadow.intensity=.75;
scene.add(sun,sun.target);
const hemi=new THREE.HemisphereLight(0xcfe3ff,0x4a5a2a,.5); scene.add(hemi);

// shader cloud dome (2D fbm cloud layer projected to sky, sun-lit, horizon fog blend)
const cloudMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.BackSide,fog:false,
 uniforms:{uTime:U.uTime,uCover:{value:.4},uDark:{value:0},uGray:{value:0},uSun:{value:sunDir},uFogC:{value:new THREE.Color()},uOff:{value:new THREE.Vector2()},uFlash:{value:0},uBright:{value:1},uSunCol:{value:new THREE.Color(1,1,1)}},
 vertexShader:`varying vec3 vDir; void main(){vDir=position; vec4 p=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*p;}`,
 fragmentShader:NOISE+`varying vec3 vDir; uniform float uTime,uCover,uDark,uGray,uFlash,uBright; uniform vec3 uSun,uFogC,uSunCol; uniform vec2 uOff;
 void main(){ vec3 d=normalize(vDir); float y=max(d.y,0.);
  vec2 uv=d.xz/(y+.12)*1.1+uOff;
  float n=fbm(uv*.32); float n2=fbm(uv*.32+uSun.xz*.06);
  float c=1.-uCover; float dens=smoothstep(c-.12,c+.18,n);
  float thick=smoothstep(c,c+.6,n);
  float lit=clamp(.55+(n-n2)*5.,0.,1.);
  float sunAmt=pow(max(dot(d,uSun),0.),6.);
  vec3 top=uSunCol*uBright*1.15*(1.0+.6*sunAmt)*mix(1.,.6,uDark);
  vec3 bot=mix(vec3(.7,.74,.8),vec3(.22,.24,.27),uDark)*uBright;
  vec3 col=mix(bot,top,lit*(1.-thick*.6*uDark));
  col+= (1.-thick)*sunAmt*uSunCol*.6*(1.-uDark);
  vec3 ov=mix(vec3(.85,.88,.92),vec3(.42,.45,.5),uDark)*.72*(.82+.36*n);
  float a=dens*smoothstep(0.,.08,d.y);
  col=mix(col,ov,uGray*(1.-dens*.4)); a=max(a,uGray);
  float hz=exp(-y*18.)*mix(.3,1.,uGray);
  col=mix(col,uFogC,hz); a=max(a,hz*.85);
  if(d.y<0.){col=uFogC;a=1.;}
  col+=uFlash*vec3(1.6,1.7,2.)*(.4+n);
  gl_FragColor=vec4(col,a);}`});
const cloudDome=new THREE.Mesh(new THREE.SphereGeometry(3500,48,24),cloudMat); cloudDome.renderOrder=-1; scene.add(cloudDome);

// ---------- material patcher: wind sway, snow accumulation, wet ground ----------
function patch(mat,kind){
 mat.onBeforeCompile=(sh)=>{
  Object.assign(sh.uniforms,U);
  const sway={
   grass:`float h=position.y; if(h>.75) h=1.; vH=h;
    float ph=uTime*(1.3+uWind*2.2)+dot(wpos.xz,uWindDir)*.35;
    float gust=(sin(ph)*.5+.5)*.6+.4*sin(ph*2.3+wpos.x*.7);
    float bend=h*h*(.07+uWind*.32*(.4+gust));
    wpos.xz+=uWindDir*bend+vec2(sin(uTime*1.7+wpos.z),cos(uTime*1.3+wpos.x))*.025*h;
    wpos.y-=bend*bend*.7+h*uSnowG*.12;`,
   tree:`float hh=max(wpos.y-modelMatrix[3].y,0.); vH=hh;
    float sw=(sin(uTime*(.7+uWind*.8)+modelMatrix[3].x*.3)*.5+.7)*uWind;
    wpos.xz+=uWindDir*hh*hh*.0035*sw+vec2(sin(uTime*4.+wpos.y*2.+wpos.x),cos(uTime*3.3+wpos.z*2.))*.012*uWind*min(hh,6.)*.3;`,
   ground:`vH=0.;`, prop:`vH=0.;`}[kind];
  sh.vertexShader=`uniform float uTime,uWind,uSnowG; uniform vec2 uWindDir; varying vec3 vWP; varying vec3 vWN; varying float vH;\n`+
   sh.vertexShader.replace('#include <project_vertex>',`
    vec4 mvPosition=vec4(transformed,1.);
    #ifdef USE_INSTANCING
    mvPosition=instanceMatrix*mvPosition;
    #endif
    vec4 wpos=modelMatrix*mvPosition; ${sway}
    vWP=wpos.xyz; vWN=normalize(mat3(modelMatrix)*objectNormal);
    mvPosition=viewMatrix*wpos; gl_Position=projectionMatrix*mvPosition;`);
  const col={
   grass:`diffuseColor.rgb*=mix(.5,1.12,vH); sm=uSnowG*smoothstep(.1,.9,vH+.4*uSnowG); diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.92,.94,.97),sm*.85); diffuseColor.rgb*=1.-.35*uWet;`,
   ground:`float gn=vnoise(vWP.xz*.3)*.6+vnoise(vWP.xz*1.9)*.4;
    sm=smoothstep(gn-.12,gn+.04,uSnowG*1.12); diffuseColor.rgb=mix(diffuseColor.rgb*(1.-.5*uWet),vec3(.93,.95,.98),sm);
    puddle=smoothstep(.6,.68,vnoise(vWP.xz*.22+7.))*uWet;`,
   tree:`sm=uSnowG*smoothstep(.35,.85,vWN.y)*.85; diffuseColor.rgb=mix(diffuseColor.rgb*(1.-.3*uWet),vec3(.92,.94,.97),sm);`,
   prop:`sm=uSnowG*smoothstep(.6,.95,vWN.y)*.7; diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.92,.94,.97),sm);`}[kind];
  sh.fragmentShader=`uniform float uTime,uSnowG,uWet; varying vec3 vWP; varying vec3 vWN; varying float vH;\n`+NOISE+
   sh.fragmentShader.replace('#include <map_fragment>',`#include <map_fragment>\n float sm=0.,puddle=0.;\n`+col)
   .replace('#include <roughnessmap_fragment>',`#include <roughnessmap_fragment>
     roughnessFactor=mix(roughnessFactor,.3,uWet*.6); roughnessFactor=mix(roughnessFactor,.04,puddle); roughnessFactor=mix(roughnessFactor,.8,sm);`)
   .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
     normal=normalize(mix(normal,normalize((viewMatrix*vec4(0.,1.,0.,0.)).xyz),clamp(puddle+sm*.6,0.,1.)));`);
 };
 mat.customProgramCacheKey=()=>kind;
}

// ---------- loading ----------
const mgr=new THREE.LoadingManager(); const pb=document.getElementById('pb');
mgr.onProgress=(u,a,b)=>pb.style.width=(a/b*100)+'%';
const gltf=new GLTFLoader(mgr), tl=new THREE.TextureLoader(mgr);
const load=u=>new Promise((r,j)=>gltf.load(u,r,undefined,j));
const pmrem=new THREE.PMREMGenerator(renderer);
new RGBELoader(mgr).load('assets/hdr/sky_1k.hdr',t=>{t.mapping=THREE.EquirectangularReflectionMapping; scene.environment=pmrem.fromEquirectangular(t).texture; t.dispose();});

// ground (terrain modeled in Blender) + Poly Haven PBR texture
const gtex=(f,srgb)=>{const t=tl.load('assets/tex/'+f);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(70,70);t.anisotropy=8;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t;};
const groundMat=new THREE.MeshStandardMaterial({map:gtex('aerial_grass_rock_diff.jpg',1),normalMap:gtex('aerial_grass_rock_nor_gl.jpg'),roughnessMap:gtex('aerial_grass_rock_rough.jpg'),color:0xb4dc6a});
patch(groundMat,'ground');

// heightfield lookup (matches Blender terrain: flat near center)
let terrain; let HG=null; const HN=161;
function buildHeight(){ HG=new Float32Array(HN*HN).fill(0); terrain.traverse(o=>{ if(!o.isMesh) return; const a=o.geometry.attributes.position; const v=new THREE.Vector3();
  for(let i=0;i<a.count;i++){ v.fromBufferAttribute(a,i).applyMatrix4(o.matrixWorld); const gx=Math.round((v.x+100)/200*(HN-1)), gz=Math.round((v.z+100)/200*(HN-1)); if(gx>=0&&gz>=0&&gx<HN&&gz<HN) HG[gz*HN+gx]=v.y; } }); }
function heightAt(x,z){ if(!HG) return 0; const fx=(x+100)/200*(HN-1), fz=(z+100)/200*(HN-1); const x0=Math.max(0,Math.min(HN-2,Math.floor(fx))), z0=Math.max(0,Math.min(HN-2,Math.floor(fz))); const tx=fx-x0,tz=fz-z0;
  const h=(i,j)=>HG[j*HN+i]; return (h(x0,z0)*(1-tx)+h(x0+1,z0)*tx)*(1-tz)+(h(x0,z0+1)*(1-tx)+h(x0+1,z0+1)*tx)*tz; }

// ---------- instanced shader grass ----------
function makeGrass(count,R){
 const seg=5,pos=[],idx=[],nrm=[];
 for(let i=0;i<=seg;i++){const y=i/seg,w=.5*Math.pow(1-y,.9)*(i==seg?0:1),z=y*y*.18;
  pos.push(-w,y,z, w,y,z); nrm.push(0,1,.3,0,1,.3);
  if(i<seg){const a=i*2;idx.push(a,a+1,a+2, a+1,a+3,a+2);} }
 const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3)); g.setIndex(idx);
 const m=new THREE.MeshStandardMaterial({side:THREE.DoubleSide,roughness:.75,color:0xffffff});
 patch(m,'grass');
 const mesh=new THREE.InstancedMesh(g,m,count); const d=new THREE.Object3D(); const c=new THREE.Color();
 for(let i=0;i<count;i++){const r=R*Math.pow(Math.random(),.75),a=Math.random()*6.283;
  const x=Math.cos(a)*r,z=Math.sin(a)*r; d.position.set(x,heightAt(x,z)-.02,z); d.rotation.set(0,Math.random()*6.28,0);
  const h=.1+Math.random()*.18; d.scale.set(.022+Math.random()*.018,h,1); d.updateMatrix(); mesh.setMatrixAt(i,d.matrix);
  c.setHSL(.2+Math.random()*.07,.62+Math.random()*.25,.32+Math.random()*.13); mesh.setColorAt(i,c);}
 mesh.receiveShadow=true; mesh.frustumCulled=false; return mesh;
}

// ---------- wildflowers (instanced, canvas petal texture, sway with grass shader) ----------
function petalTex(){ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'); g.translate(64,64);
 for(let i=0;i<10;i++){ g.rotate(Math.PI/5); const gr=g.createLinearGradient(0,0,0,58); gr.addColorStop(0,'#ddd');gr.addColorStop(1,'#fff'); g.fillStyle=gr; g.beginPath(); g.ellipse(0,32,11,28,0,0,6.3); g.fill(); }
 g.fillStyle='#e8b31a'; g.beginPath(); g.arc(0,0,13,0,6.3); g.fill(); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
function makeFlowers(n){

 for(const n of ['l_thigh','r_thigh','l_knee','r_knee','spine','neck']) setBone(n,0,0,0);
 setBone('l_shoulder',.12,0,0); setBone('r_shoulder',-THREE.MathUtils.lerp(-.12,2.0,umbAmt),0,0);
 girl.umb.scale.setScalar(Math.max(umbAmt,1e-4)); girl.umb.visible=umbAmt>.02;
}

const SPOTS=[[-1.9,2.3],[0.1,3.0],[2.1,2.2],[-1.0,-1.2],[1.3,-.8]];
function animKids(dt,t){
 const w=cur.wind;
 umbAmt+=((curName==='rain'?1:0)-umbAmt)*Math.min(1,dt*2);
 const play = curName==='sunny'||curName==='wind'||curName==='snow' ? 1 : curName==='rain' ? .15 : .55;
 kids.forEach((K,i)=>{
  const [bx,bz]=SPOTS[i];
  const ph=t*7.5*(.8+.4*play)+K.ph; const run=play*(1-umbAmt*.85);
  K.root.position.set(bx+Math.sin(t*.4+i)*.3, 0, bz+Math.sin(t*.35+i*1.7)*.9*run);
  K.root.rotation.y=Math.PI+Math.sin(t*.4+i)*.15; // face camera (+Z)
  const sw=Math.sin(ph)*.75*run;
  K.legL.rotation.x=sw; K.legR.rotation.x=-sw; K.legL.rotation.z=K.legR.rotation.z=0;
  K.n.position.y=Math.abs(Math.cos(ph))*.06*run;
  const up=(2.5+Math.sin(ph*.5+i)*.25)*run; // arms raised happily
  K.armL.rotation.set(-sw*.4*(1-run*.6),0,up+.1); K.armR.rotation.set(sw*.4*(1-run*.6),0,-up-.1);
  if(umbAmt>.01){ K.armR.rotation.x=THREE.MathUtils.lerp(K.armR.rotation.x,-1.25,umbAmt); K.armR.rotation.z=THREE.MathUtils.lerp(K.armR.rotation.z,.15,umbAmt);
    K.armL.rotation.z=THREE.MathUtils.lerp(K.armL.rotation.z,.15,umbAmt); K.armL.rotation.x=0;}
  K.umb.scale.setScalar(Math.max(umbAmt,0.0001)); K.umb.visible=umbAmt>.02;
  K.torso.rotation.x=.12*run+Math.sin(t*1.7+K.ph)*.015; K.torso.rotation.z=Math.min(w,1.8)*.05;
  K.head.rotation.y=Math.sin(t*.6+K.ph*2)*.3; K.head.rotation.x=-.08*run+Math.sin(t*.9+K.ph)*.05;
 });
}

// ---------- audio (CC0 field recordings, WebAudio crossfade) ----------
let actx=null, muted=false; const tracks={}; let thunderBuf=null; let master;
const MIX={sunny:{sunny:.9,kids:.35},overcast:{overcast:.5,sunny:.12},rain:{rain:1},snow:{snow:.6,kids:.12},fog:{fogamb:.6},wind:{wind:1,kids:.15}};
async function initAudio(){
 if(actx) return; actx=new (window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.connect(actx.destination);
 const files={sunny:'sunny.mp3',overcast:'overcast.mp3',rain:'rain.mp3',snow:'snow.mp3',wind:'wind.mp3',kids:'kids.mp3',fogamb:'sunny.mp3'};
 const bufs={};
 await Promise.all(Object.entries(files).map(async([k,f])=>{ try{ if(!bufs[f]) bufs[f]=actx.decodeAudioData(await (await fetch('assets/audio/'+f)).arrayBuffer()); const b=await bufs[f];
   const src=actx.createBufferSource(); src.buffer=b; src.loop=true; const g=actx.createGain(); g.gain.value=0; let node=src;
   if(k==='fogamb'){const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700; src.connect(lp); node=lp; src.playbackRate.value=.92;}
   node.connect(g); g.connect(master); src.start(0,Math.random()*Math.max(0,b.duration-5)); tracks[k]=g; }catch(e){console.warn('audio',k,e);} }));
 try{ thunderBuf=await actx.decodeAudioData(await (await fetch('assets/audio/thunder.mp3')).arrayBuffer()); }catch(e){}
 applyMix();
}
function applyMix(){ if(!actx) return; const m=MIX[curName]; const now=actx.currentTime;
 for(const k in tracks){ tracks[k].gain.cancelScheduledValues(now); tracks[k].gain.setTargetAtTime(m[k]||0,now,1.0); } }
function playThunder(){ if(!actx||!thunderBuf||curName!=='rain') return; const s=actx.createBufferSource(); s.buffer=thunderBuf; const g=actx.createGain(); g.gain.value=.9; s.connect(g); g.connect(master); s.start(0,0,Math.min(14,thunderBuf.duration)); }

// ---------- UI ----------
const bar=document.getElementById('bar');
ORDER.forEach(k=>{const b=document.createElement('button'); b.textContent=W[k].icon+' '+W[k].name; b.dataset.k=k; b.onclick=()=>{initAudio(); setWeather(k);
  document.getElementById('hint').style.display='none'; if(actx&&actx.state==='suspended')actx.resume();}; bar.appendChild(b);});
document.getElementById('mute').onclick=e=>{muted=!muted; if(master)master.gain.value=muted?0:1; e.target.textContent=muted?'🔇 静音':'🔊 声音';};
function setWeather(k,instant){ curName=k; target=W[k];
 document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 document.querySelector('#info h3').textContent=W[k].icon+' '+W[k].t; document.querySelector('#info div').textContent=W[k].d;
 if(instant){ for(const q of KEYS) cur[q]=target[q]; cur.fogC.set(target.fogC); cur.light.set(target.light); umbAmt=k==='rain'?1:0; }
 if(k==='rain') nextBolt=simT+(instant?1.5:4);
 applyMix(); }
window.setWeather=setWeather; window.__audioTest=async()=>{await initAudio(); return {state:actx.state,tracks:Object.keys(tracks),thunder:!!thunderBuf};}; window.__pick=(x,y)=>{const r=new THREE.Raycaster(); r.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),camera); return r.intersectObjects(scene.children,true).filter(h=>!h.object.isPoints).slice(0,4).map(h=>h.object.name+'|'+h.object.type+'|'+(h.object.parent&&h.object.parent.name)+'|'+h.distance.toFixed(2)+'|'+h.object.material?.type);};

// ---------- post-processing ----------
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const gtao=new GTAOPass(scene,camera,innerWidth,innerHeight); gtao.updateGtaoMaterial({radius:.5,distanceExponent:1.5,thickness:1,scale:1.2,samples:12}); gtao.blendIntensity=.9;
composer.addPass(gtao); const FX=[]; { const orig=gtao.render.bind(gtao); gtao.render=(...a)=>{const v=FX.map(o=>o.visible); FX.forEach(o=>o.visible=false); orig(...a); FX.forEach((o,i)=>o.visible=v[i]);}; } 
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth/2,innerHeight/2),.3,.55,.85); composer.addPass(bloom);
const godrays=new ShaderPass({uniforms:{tDiffuse:{value:null},uSun:{value:new THREE.Vector2(.8,.9)},uAmt:{value:0}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`uniform sampler2D tDiffuse; uniform vec2 uSun; uniform float uAmt; varying vec2 vUv;
 void main(){ vec4 c=texture2D(tDiffuse,vUv); if(uAmt<.001){gl_FragColor=c;return;} vec2 d=(uSun-vUv)/40.; vec2 p=vUv; vec3 acc=vec3(0.); float w=1.;
  for(int i=0;i<40;i++){ p+=d; vec3 s=texture2D(tDiffuse,clamp(p,0.,1.)).rgb; float l=max(dot(s,vec3(.3,.5,.2))-.95,0.); acc+=s*l*w; w*=.965; }
  float fall=smoothstep(1.4,.0,distance(vUv,uSun)); gl_FragColor=vec4(c.rgb+acc*uAmt*.09*fall*vec3(1.,.95,.8),c.a);}`});
composer.addPass(godrays);
composer.addPass(new OutputPass());
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},uSat:{value:1.2},uWarm:{value:.05},uLift:{value:.05}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`uniform sampler2D tDiffuse; uniform float uSat,uWarm,uLift; varying vec2 vUv;
 void main(){ vec3 c=texture2D(tDiffuse,vUv).rgb;
  c=c*(1.-uLift)+uLift;
  float l=dot(c,vec3(.2126,.7152,.0722)); c=mix(vec3(l),c,uSat);
  float sk=smoothstep(.1,.35,c.b-c.g+.15)*step(.5,vUv.y); c+=vec3(uWarm,uWarm*.45,-uWarm*.6)*(.4+.6*l)*(1.-sk); c=mix(c,c*vec3(.92,.97,1.08),sk*.6);
  c=mix(c,c*c*(3.-2.*c),.12);
  vec2 q=vUv-.5; c*=1.-dot(q,q)*.25;
  gl_FragColor=vec4(clamp(c,0.,1.),1.);}`});
composer.addPass(grade);
let lightningOn=true; document.getElementById('lt').onclick=e=>{lightningOn=!lightningOn; e.target.textContent='⚡ 闪电：'+(lightningOn?'开':'关'); if(!lightningOn){flash=0;}};
let hq=false; gtao.enabled=false; document.getElementById('hq').onclick=e=>{hq=!hq; gtao.enabled=hq; renderer.setPixelRatio(hq?Math.min(devicePixelRatio,1.5):1); onResize(); e.target.textContent='画质：'+(hq?'高':'流畅');};
function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);}
addEventListener('resize',onResize);

// ---------- build world ----------
let rain,splash,snow,leaves;
const clock=new THREE.Clock();
(async()=>{
 const [ter,ta,tb,sh,kd,gl,ka,kb]=await Promise.all(['terrain','tree_a','tree_b','shrub','kids','girl','kid_a','kid_b'].map(n=>load('assets/models/'+n+'.glb')));
 terrain=ter.scene; terrain.traverse(o=>{if(o.isMesh){o.material=groundMat;o.receiveShadow=true;}}); scene.add(terrain); terrain.updateMatrixWorld(true); buildHeight();
 scene.add(makeGrass(SHOT?140000:160000,24));
 const protos=[ta.scene,tb.scene];
 protos.forEach(p=>p.traverse(o=>{if(o.isMesh){ if(/leaves/i.test(o.material.name)){o.material.color.set(0xc8f07a);o.material.emissive.set(0x1a2a05);} else o.material.color.set(0xd8cfc0);o.castShadow=true;o.receiveShadow=true;patch(o.material,'tree');}}));
 sh.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;patch(o.material,'tree');}});
 const spots0=[[-8,-1,0,1.35],[9,-5,1,1.3],[-15,-12,1,1.2],[15,-14,0,1.1],[-22,-25,0,1.2],[22,-28,1,1.3],[-6,-34,1,1.2],[7,-40,0,1.3],[-4,-18,0,1.3],[20,-16,1,1.2],[-24,-14,0,1.1],[3,-28,1,1.4],[-30,8,1,1.2],[28,14,0,1],[-12,22,0,1.1],[12,24,1,1.2]];
 const spots=spots0.slice(0,10); for(const [x,z,ti,s] of spots){const t=protos[ti].clone(); t.position.set(x,heightAt(x,z)-.05,z); t.rotation.y=Math.random()*6.28; t.scale.setScalar(s*(ti?1.9:2.2)); scene.add(t);}
 for(let i=0;i<14;i++){const a=Math.random()*6.28,r=6+Math.random()*16; const x=Math.cos(a)*r,z=Math.sin(a)*r; if(z>-3&&Math.abs(x)<5)continue; if(Q.has('noshrub'))continue; const b=sh.scene.clone(); b.position.set(x,heightAt(x,z),z); b.scale.setScalar(.8+Math.random()*.8); b.rotation.y=a; scene.add(b);}
 setupMixKids([ka.scene,kb.scene], kd.scene); setupGirl(gl.scene, kd.scene); scene.add(makeFlowers(SHOT?7000:9000), makeButterflies(14));
 rain=makeRain(SHOT?9000:14000); splash=makeSplash(1400); snow=makeSnow(SHOT?9000:14000); leaves=makeLeaves(500);
 scene.add(rain,splash,snow,leaves); FX.push(rain,splash,snow,leaves,cloudDome);
 setWeather(ORDER.includes(Q.get('w'))?Q.get('w'):'sunny',true);
 document.getElementById('load').style.opacity=0; setTimeout(()=>document.getElementById('load').remove(),900);
 window.__ready=true;
 if(SHOT){ window.simulate=(sec,step=.1)=>{ const r=composer.render; composer.render=()=>{}; for(let i=0;i<sec/step-1;i++) frame(step); composer.render=r; frame(step); return true; }; }
 else renderer.setAnimationLoop(frame);
})().catch(e=>{console.error(e); document.querySelector('#load div').textContent='加载失败：'+e.message+'（请用本地服务器打开，例如 python -m http.server）';});

// ---------- frame ----------
let windOff=new THREE.Vector2(), fpsAcc=0,fpsN=0,autoChecked=false;
const tmpC=new THREE.Color();
let simT=0;
function frame(fixed){
 const dt=typeof fixed==='number'?fixed:Math.min(clock.getDelta(),.1); simT+=dt; const t=simT;
 for(const k of KEYS){const r=RATE[k]||.9; cur[k]+=(target[k]-cur[k])*Math.min(1,dt*r);}
 cur.fogC.lerp(tmpC.set(target.fogC),Math.min(1,dt*.9)); cur.light.lerp(tmpC.set(target.light),Math.min(1,dt*.9));
 U.uTime.value=t; U.uWind.value=cur.wind+(curName==='wind'?Math.sin(t*.7)*.35+Math.sin(t*1.9)*.15:0); U.uSnowG.value=cur.snowG; U.uWet.value=cur.wet;
 // sky
 const phi=THREE.MathUtils.degToRad(90-cur.elev), th=THREE.MathUtils.degToRad(140);
 sunDir.setFromSphericalCoords(1,phi,th);
 const su=sky.material.uniforms; su.sunPosition.value.copy(sunDir); su.turbidity.value=cur.turb; su.rayleigh.value=cur.ray; su.mieCoefficient.value=cur.mie; su.mieDirectionalG.value=.8; su.uTint.value=1.-cur.gray;
 // lightning
 if(curName==='rain'&&lightningOn&&t>nextBolt){spawnBolt(); nextBolt=t+20+Math.random()*20;}
 if(curName!=='rain'){flash=0; if(bolt)bolt.visible=false;} flash=Math.max(0,flash-dt*1.2); const fl=flash*.35;
 if(bolt) bolt.visible=flash>.45; boltMat.opacity=Math.min(1,flash*1.5);
 // clouds
 windOff.x+=dt*.004*cur.cloudSpd*U.uWindDir.value.x*6; windOff.y+=dt*.004*cur.cloudSpd*U.uWindDir.value.y*6;
 const cu=cloudMat.uniforms; cu.uCover.value=cur.cover; cu.uDark.value=cur.dark; cu.uGray.value=cur.gray; cu.uFogC.value.copy(cur.fogC); cu.uOff.value.copy(windOff); cu.uFlash.value=fl;
 cu.uBright.value=.62+cur.sun*.14; cu.uSunCol.value.copy(cur.light);
 cloudDome.position.copy(camera.position); if(Q.has('noclouds'))cloudDome.visible=false;
 // lights
 sun.position.copy(sunDir).multiplyScalar(60); sun.target.position.set(0,0,0);
 sun.intensity=cur.sun; sun.color.copy(cur.light); sun.castShadow=true;
 hemi.intensity=cur.hemi+fl*3; hemi.color.copy(cur.light).lerp(tmpC.set(0xcfe4ff),.4); hemi.groundColor.set(0x8fae55); 
 scene.environmentIntensity=cur.env+fl*1.5;
 scene.fog.color.copy(cur.fogC).multiplyScalar(1+fl*.6); scene.fog.density=cur.fog;
 renderer.toneMappingExposure=cur.exp; grade.uniforms.uSat.value=cur.sat; grade.uniforms.uWarm.value=cur.warm; grade.uniforms.uLift.value=cur.lift;
 { const sp=sunDir.clone().multiplyScalar(5000).add(camera.position).project(camera); godrays.uniforms.uSun.value.set(sp.x*.5+.5,sp.y*.5+.5);
   godrays.uniforms.uAmt.value=sp.z<1?Math.max(0,(cur.sun-1)/4.)*(1-cur.gray):0; } bloom.strength=cur.bloom;
 // particles
 const c=controls.target; const fd=cur.fog;
 rain.material.uniforms.uAmt.value=cur.rain; rain.material.uniforms.uC.value.copy(c); rain.material.uniforms.uCol.value.setRGB(.55,.6,.66).multiplyScalar(1+fl*2); rain.material.uniforms.uFogC.value.copy(cur.fogC); rain.material.uniforms.uFogD.value=fd; rain.visible=cur.rain>.01;
 splash.material.uniforms.uAmt.value=cur.rain; splash.material.uniforms.uCol.value.setRGB(.6,.65,.7); splash.visible=cur.rain>.05;
 snow.material.uniforms.uAmt.value=cur.snow; snow.material.uniforms.uC.value.copy(c); snow.material.uniforms.uFogC.value.copy(cur.fogC); snow.material.uniforms.uFogD.value=fd; snow.visible=cur.snow>.01;
 leaves.material.uniforms.uAmt.value=cur.leaves; leaves.material.uniforms.uFogC.value.copy(cur.fogC); leaves.material.uniforms.uFogD.value=fd; leaves.material.uniforms.uLight.value=.4+cur.sun*.25; leaves.visible=cur.leaves>.01;
 animMixKids(dt,t); animGirl(dt,t); animButterflies(t,cur.bfly);
 controls.update();
 composer.render();
 
}
</script></body></html>

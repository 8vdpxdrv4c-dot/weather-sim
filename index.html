<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天气小课堂 · 3D 天气模拟</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bfe3f7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
canvas{display:block}
#ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:12px;padding:10px 14px;background:rgba(255,255,255,.55);border-radius:28px;backdrop-filter:blur(6px);box-shadow:0 6px 24px rgba(0,60,120,.15)}
#ui button{font-size:24px;font-weight:700;width:64px;height:64px;border:none;border-radius:50%;cursor:pointer;color:#35506b;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12);transition:transform .2s,background .3s,color .3s}
#ui button:hover{transform:translateY(-3px)}
#ui button.on{background:#ffb938;color:#fff;transform:translateY(-3px) scale(1.06)}
#ui button span{display:block;font-size:12px;font-weight:400;margin-top:-2px}
#hint{position:fixed;top:14px;right:16px;color:#35506b;background:rgba(255,255,255,.6);padding:6px 12px;border-radius:14px;font-size:14px}
#title{position:fixed;top:14px;left:16px;color:#fff;font-size:22px;font-weight:700;text-shadow:0 2px 6px rgba(0,50,100,.35)}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/addons/"}}</script>
</head>
<body>
<div id="title">天气小课堂</div>
<div id="hint">🔊 点击按钮切换天气（拖动可转动视角）</div>
<div id="ui">
<button data-w="sunny">☀️<span>晴</span></button>
<button data-w="overcast">☁️<span>阴</span></button>
<button data-w="rain">🌧️<span>雨</span></button>
<button data-w="snow">❄️<span>雪</span></button>
<button data-w="fog">🌫️<span>雾</span></button>
<button data-w="wind">🍃<span>风</span></button>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
